<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS — weekly training planner</title>
<!-- A classical serif for stage titles and figures only. Offline (opened
     from disk without a connection) they fall back to Georgia. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- One screen, three stages. The sculpture is a single element behind
     them all; moving between stages moves its camera (stages.js), and each
     stage's interface settles around it. -->
<div class="atlas" id="atlas" data-stage="targets" data-phase="idle">

  <header class="masthead">
    <div class="mast-start">
      <span class="brand">ATLAS</span>
      <span class="mast-stage" id="stage-label"><span class="n">01</span> / Targets</span>
    </div>
    <nav class="stage-nav" id="stage-nav" aria-label="Stages">
      <button type="button" data-goto="targets" aria-current="step"><span>Targets</span></button>
      <button type="button" data-goto="nutrition"><span>Nutrition</span></button>
      <button type="button" data-goto="plan"><span>Week plan</span></button>
    </nav>
    <div class="mast-end">
      <button type="button" class="theme-btn" id="theme" aria-label="Switch colour theme">
        <span id="theme-icon" aria-hidden="true">☾</span><span id="theme-label">Dark</span>
      </button>
    </div>
  </header>

  <!-- ============================ Stage 1: targets ========================= -->
  <section class="stage stage-targets" id="stage-targets" aria-labelledby="targets-title">
    <div class="rail rail-start" data-scroll data-reveal="0">
      <div class="rail-head">
        <p class="eyebrow"><span class="n">01</span> / Targets</p>
        <h1 class="display" id="targets-title" tabindex="-1">Define your focus</h1>
        <p class="lede">Begin from a program, then refine it on the sculpture.</p>
      </div>
      <div class="programs" id="programs"></div>
    </div>
    <div class="rail-gap" aria-hidden="true"></div>
    <div class="rail rail-end" id="focus-summary" data-scroll data-reveal="2" aria-live="polite"></div>
  </section>

  <!-- The body's stage, one layer behind every stage (z-index puts it
       there; it comes after Targets in the source so the keyboard meets
       the programs and the focus summary before the muscles). The page
       talks to AnatomyStage; the renderer it mounts into the viewport
       draws everything inside it. -->
  <div class="anatomy-stage" id="anatomy-stage">
    <div class="anatomy-viewport" data-anatomy-mount></div>
    <div class="figure-controls">
      <p class="anatomy-caption" id="anatomy-caption" aria-live="polite"></p>
      <div class="turn" id="turn" role="group" aria-label="Turn the body">
        <button type="button" data-view="front" aria-pressed="true">Front</button>
        <span class="turn-line" aria-hidden="true"></span>
        <button type="button" data-view="back" aria-pressed="false">Back</button>
      </div>
    </div>
  </div>

  <!-- =========================== Stage 2: nutrition ======================== -->
  <!-- Optional. The plan sits right of the sculpture; nutrition-view.js
       draws it, and "A day of eating", into the panel. -->
  <section class="stage stage-nutrition" id="stage-nutrition" data-scroll aria-labelledby="nutrition-title">
    <div class="nu" id="nutrition-panel"></div>
  </section>

  <!-- =========================== Stage 3: week plan ======================== -->
  <!-- Fit it into your life, Shape your week, and Your week: week-view.js
       draws whichever is open into the panel. -->
  <section class="stage stage-plan" id="stage-plan" data-scroll data-view="config" aria-labelledby="plan-title">
    <div class="wk" id="week-panel"></div>
  </section>

  <!-- The way on and back. Inside Training it is the step progress; on a
       phone it also holds the stage navigation. -->
  <footer class="stage-foot" id="stage-foot">
    <div class="foot-start">
      <button type="button" class="quiet-btn" id="foot-back" hidden></button>
    </div>
    <nav class="foot-dots" id="foot-dots" aria-label="Stages"></nav>
    <div class="foot-end">
      <button type="button" class="quiet-btn" id="foot-skip" hidden></button>
      <span class="foot-hint" id="foot-hint"></span>
      <button type="button" class="btn primary" id="foot-next" hidden></button>
    </div>
  </footer>
</div>

<!-- Classic scripts, loaded in dependency order. They share the global scope,
     so the page still works when opened straight from disk (file://), which
     ES modules would not. -->
<script src="js/model.js"></script>
<script src="js/programs.js"></script>
<script src="js/selection.js"></script>
<script src="js/evidence.js"></script>
<script src="js/estimate.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/foods.js"></script>
<script src="js/exercises.js"></script>
<script src="js/workouts.js"></script>
<script src="js/distribution.js"></script>
<script src="js/routine.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/anatomy-model.js"></script>
<!-- The Male_Body sculpture is the anatomy stage's figure
     (js/anatomy-model-male-body.js, 8 MB). index.html?anatomy=procedural
     leaves it out, showing the procedural figure it replaced. -->
<script>
  var MALE_BODY_SRC = "js/anatomy-model-male-body.js";
  if (new URLSearchParams(location.search).get("anatomy") !== "procedural")
    document.write('<script src="' + MALE_BODY_SRC + '"><\/script>');
</script>
<script src="js/anatomy-regions.js"></script>
<script src="js/anatomy.js"></script>
<script src="js/anatomy-cartography.js"></script>
<script src="js/anatomy-sculpture.js"></script>
<script src="js/anatomy-stage.js"></script>
<script src="js/render.js"></script>
<script src="js/storage.js"></script>
<script src="js/stages.js"></script>
<script src="js/targets.js"></script>
<script src="js/workout-view.js"></script>
<script src="js/nutrition-view.js"></script>
<script src="js/week-view.js"></script>
<script src="js/paint.js"></script>
<script src="js/app.js"></script>
</body>
</html>
